<!doctype html><html lang=az><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Network Map</title>
<style>
:root{--bg:#0a0b0e;--p:#101217f0;--b:#232730;--t:#d4d8df;--m:#7d8594;--r:#d93a40;--ok:#3fb950;--w:#d29922;--d:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--dl:344px;--dr:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:13px/1.45 system-ui,"Segoe UI",sans-serif}
#g{position:fixed;inset:0;background-color:#0a0b0e;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}
.p{position:fixed;background:var(--p);border:1px solid var(--b);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 6px 24px #0008}
.ic{display:inline-flex;vertical-align:-3px}.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{top:10px;left:10px;right:10px;height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:6}
.brand{font-weight:700;letter-spacing:.14em;color:#fff;margin-right:8px}.brand b{color:var(--r)}
input,select,button,textarea{background:#0d0f13;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 11px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--r)}button{cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}button:hover{background:#1b1e26}button.on{border-color:var(--r);color:#fff;background:#2a1215}button.pri{background:var(--r);border-color:var(--r);color:#fff}button.pri:hover{background:#e5484d}button.dng{color:var(--d)}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--b);font-family:var(--mono);font-size:12px;white-space:nowrap}.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}.online{background:var(--ok)}.degraded{background:var(--w)}.offline{background:var(--d);animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}
#warn{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:7;background:#2a1215;border:1px solid var(--r);color:#ffb3b6;padding:6px 16px;border-radius:8px;display:none;font-size:12px}
#L{top:70px;left:10px;bottom:10px;width:322px;z-index:4;display:flex;flex-direction:column;padding:12px;transition:transform .22s}#L.h{transform:translateX(-345px)}
#R{top:70px;right:10px;bottom:10px;width:372px;z-index:4;overflow:auto;padding:14px;transition:transform .22s}#R.h{transform:translateX(395px)}
#D{left:var(--dl);right:var(--dr);bottom:10px;height:210px;z-index:3;padding:8px 12px;display:flex;flex-direction:column;transition:transform .22s}#D.h{transform:translateY(120%)}#D.big{height:60vh}
#mc{position:fixed;top:70px;left:var(--dl);z-index:3;display:flex;gap:6px}
#list{overflow:auto;flex:1;margin-top:8px}.dev{display:flex;gap:2px;align-items:flex-start;padding:8px 9px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}.dev:hover{background:#ffffff0a}.dev.s{background:#d93a4018;border-left-color:var(--r)}
.dev .ic{color:#9aa3b2;margin-right:8px;margin-top:2px}.m{color:var(--m);font-size:12px}.mono{font-family:var(--mono);font-size:12px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
h4{margin:14px 0 6px;color:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
table{width:100%;border-collapse:collapse}td{padding:5px 0;vertical-align:top;border-bottom:1px solid #ffffff0a}td:first-child{color:var(--m);width:34%}
.tabs{display:flex;gap:6px;align-items:center}.tab{padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--m)}.tab.a{background:#1b1e26;color:#fff}
.body{flex:1;overflow:auto;margin-top:6px}.f{padding:2px 0;font-family:var(--mono);font-size:12px}.up{color:var(--ok)}.down{color:var(--d)}.warn{color:var(--w)}.new{color:#58a6ff}
pre{white-space:pre-wrap;font:12px var(--mono);margin:6px 0}
#R select,#R input{max-width:100%}.sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1px solid #ffffff30;display:inline-block}.sw:hover{transform:scale(1.15)}
#mod{position:fixed;inset:0;background:#000b;z-index:9;display:none;align-items:center;justify-content:center}#mod>div{background:#101217;border:1px solid var(--b);border-radius:14px;padding:22px;width:540px;max-width:92vw}
#mod label{display:block;margin:10px 0 4px;color:var(--m);font-size:12px}#mod input[type=text],#mod input[type=password],#mod input[type=number]{width:100%}
#toasts{position:fixed;top:70px;right:50%;transform:translateX(50%);z-index:10;display:flex;flex-direction:column;gap:6px}.toast{padding:8px 16px;border-radius:8px;background:#15171d;border:1px solid var(--b);border-left:3px solid var(--r);box-shadow:0 6px 20px #000a}
@media(max-width:1000px){#D{left:10px;right:10px}#mc{left:10px}}
</style></head><body>
<div id=g></div>
<header class=p><span class=brand>NET<b>MAP</b></span>
<button id=bL onclick="pan('L')"><i class=ic data-i=left></i>Cihazlar</button><button id=bR onclick="pan('R')"><i class=ic data-i=right></i>Detal</button><button id=bD onclick="pan('D')"><i class=ic data-i=bottom></i>Konsol</button>
<span style="flex:1"></span>

<div id=warn></div>
<div id=L class=p><input id=q placeholder="Axtar: ad, IP, MAC, vendor…"><div class=row><select id=fs><option value="">Bütün statuslar<option value=online>Online<option value=degraded>Zəif<option value=offline>Offline</select><select id=fc><option value="">Wi-Fi + LAN<option value=wifi>Wi-Fi<option value=lan>LAN</select></div><div id=list></div></div>

<div id=lg style="position:fixed;top:112px;left:var(--dl);z-index:3;display:flex;gap:12px;font-size:11px;color:var(--m)"><span><b style="color:#3fb950">━</b> switch MAC cədvəli</span><span><b style="color:#58a6ff">━</b> əl ilə</span><span><b style="color:#d93a40">━</b> route / LLDP</span><span><b style="color:#6b7280">━</b> eyni şəbəkə</span></div>
<div id=R class="p h"></div>
<div id=D class=p><div class=tabs><span class="tab a" id=t1 onclick="tab(1)">Fəaliyyət</span><span class=tab id=t2 onclick="tab(2)">Konsol</span><span class=tab id=t3 onclick="tab(3)">Terminal</span><span class=tab id=t4 onclick="tab(4)">Sistem</span><span style="flex:1"></span><button title="Böyüt" onclick="$('D').classList.toggle('big')"><i class=ic data-i=fit></i></button><button onclick="pan('D')"><i class=ic data-i=x></i></button></div>
<div class=body id=act></div><div class=body id=cns style="display:none"><div class=row><select id=cc><option>ping<option>ports<option>dns</select><input id=ct placeholder="IP / host" style="flex:1" onkeydown="if(event.key=='Enter')con()"><button class=pri onclick="con()">İcra et</button></div><pre id=co></pre></div><div class=body id=trm style="display:none;font:12px var(--mono);cursor:text"><div id=to></div><div style="display:flex;gap:8px"><span style="color:var(--ok)">noc@netmap:~$</span><input id=ti style="flex:1;border:0;background:none;padding:0" autocomplete=off spellcheck=false></div></div><div class=body id=sys style="display:none"></div></div>
<div id=mod onclick="if(event.target==this)this.style.display='none'"><div id=mb></div></div><div id=toasts></div>
<script src=/static/cytoscape.min.js></script><script>
const IC={nvr:'<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01M10 7h4M10 17h4"/>',camera:'<path d="m16 13 5.200 3.500a.5.5 0 0 0 .8-.4V7.900a.5.5 0 0 0-.8-.4L16 10.500"/><rect x="2" y="6" width="14" height="12" rx="2"/>',tv:'<rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/>',iot:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',nas:'<path d="M22 12H2M5.450 5.110 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.450-6.890A2 2 0 0 0 16.760 4H7.240a2 2 0 0 0-1.790 1.110zM6 16h.01M10 16h.01"/>',hub:'<circle cx="12" cy="12" r="3"/><path d="M12 9V3M12 21v-6M9 12H3M21 12h-6"/>',router:'<rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 18h.01M10 18h.01M15 10v4M17.8 7.2a4 4 0 0 0-5.6 0M20.7 4.3a8 8 0 0 0-11.4 0"/>',firewall:'<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.500-1.200 6.200-2.700a1.200 1.200 0 0 1 1.500 0C14.500 3.800 17 5 19 5a1 1 0 0 1 1 1z"/>',switch:'<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/>',ap:'<path d="M12 20h.01M2 8.800a15 15 0 0 1 20 0M5 12.900a10 10 0 0 1 14 0M8.500 16.400a5 5 0 0 1 7 0"/>',server:'<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>',windows:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',linux:'<path d="m4 17 6-6-6-6M12 19h8"/>',printer:'<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 9V3h12v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',unknown:'<circle cx="12" cy="12" r="10"/><path d="M9.100 9a3 3 0 0 1 5.800 1c0 2-3 3-3 3M12 17h.01"/>',internet:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.300 15.300 0 0 1 4 10 15.300 15.300 0 0 1-4 10 15.300 15.300 0 0 1-4-10 15.300 15.300 0 0 1 4-10z"/>',
refresh:'<path d="M3 12a9 9 0 0 1 15-6.700L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.700L3 16M3 21v-5h5"/>',plus:'<path d="M5 12h14M12 5v14"/>',settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',fit:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',flow:'<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',left:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',right:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/>',bottom:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/>',dash:'<path d="M3 12h3M10.500 12h3M18 12h3"/>'};
Object.assign(IC,{windows:'<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>',mac:'<path d="M12 7c-1.500-1-5-1-5 3.500 0 3.500 2.200 8.500 4 8.500.8 0 .8-.5 1-.5s.2.500 1 .5c1.800 0 4-5 4-8.500C17 6 13.500 6 12 7z"/><path d="M12 7c0-2 1-3.500 3-4"/>'});
const TYPES=['mac','nvr','router','firewall','switch','ap','server','nas','windows','linux','printer','camera','tv','iot','phone','unknown','internet'];
const ic=(n,c)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.unknown}</svg>`;
const uri=(n,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(ic(n,c||'#c9d1db').replace('<svg ','<svg width="48" height="48" '));
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
let D=[],sel=null,showSeg=true,E=[],GW=null,first=true,lastTick=0,NP={},HUBS=[],SELF=null;const H={},$=i=>document.getElementById(i),col={online:'#3fb950',degraded:'#d29922',offline:'#f85149'};
const INFRA=['router','firewall','switch','ap','server','printer'],FAR=['phone','unknown'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kind=d=>d.platform=='iphone'?(d.model||'iPhone'):d.platform=='ipad'?(d.model||'iPad'):d.platform=='android'?(d.model?'Android · '+d.model:'Android'):d.platform=='apple'?'Apple cihazı':(d.model||d.type);
const nm=d=>d.alias||d.hostname||d.ip,SW=['#e6edf3','#58a6ff','#3fb950','#d29922','#f0883e','#d93a40','#bc8cff','#ff7eb6','#39c5cf','#8b949e'];
const api=async(u,m='GET',b)=>{try{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return await r.json()}catch(e){toast('Server cavab vermir');return{}}};
const ago=t=>t?new Date(t*1000).toLocaleString():'-',dur=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+'s ':'')+(m||h?m+'d ':'')+s%60+'san'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;const c=$('toasts');c.append(t);while(c.children.length>4)c.firstChild.remove();setTimeout(()=>t.remove(),4500)}
/* panels */
const PS=(()=>{try{return JSON.parse(localStorage.ps)}catch(e){return{L:1,R:0,D:1}}})();
function applyPan(){for(const k of'LRD'){$(k).classList.toggle('h',!PS[k]);$('b'+k).classList.toggle('on',!!PS[k])}
document.body.style.setProperty('--dl',PS.L?'344px':'10px');document.body.style.setProperty('--dr',PS.R?'394px':'10px');try{localStorage.ps=JSON.stringify(PS)}catch(e){}setTimeout(()=>cy.resize(),260)}
function pan(k,v){PS[k]=v===undefined?!PS[k]:v;applyPan()}
function tab(n){['act','cns','trm','sys'].forEach((x,i)=>{$(x).style.display=i+1==n?'':'none';$('t'+(i+1)).classList.toggle('a',i+1==n)});pan('D',1);if(n==3)setTimeout(()=>$('ti').focus(),50)}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='1')pan('L');if(e.key=='2')pan('R');if(e.key=='3')pan('D');if(e.key=='f')fit()});
/* map */
const cy=cytoscape({container:$('g'),wheelSensitivity:.25,minZoom:.1,maxZoom:3,style:[
{selector:'node',style:{label:'data(l)',color:'#c9d1db','font-size':11,'font-family':'ui-monospace,Menlo,Consolas,monospace','text-valign':'bottom','text-margin-y':6,'text-outline-color':'#0a0b0e','text-outline-width':3,'background-color':'#12141a','border-width':2.500,'border-color':'data(c)',width:42,height:42,'text-wrap':'ellipsis','text-max-width':110,'background-image':'data(ic)','background-fit':'none','background-width':22,'background-height':22}},
{selector:'node[st="offline"]',style:{opacity:.6}},{selector:'node[hc != ""]',style:{'background-color':'data(hc)','background-opacity':.2}},{selector:'node:selected',style:{'border-width':4,'overlay-color':'#d93a40','overlay-opacity':.18,'overlay-padding':9}},
{selector:'edge',style:{width:2,'line-color':'#d93a40','curve-style':'bezier',opacity:.8}},{selector:'edge[src="subnet"],edge[src="direct"]',style:{width:1,'line-color':'#3a3f4a',opacity:.7}},{selector:'node[k="hub"]',style:{shape:'round-rectangle','border-style':'dashed',width:34,height:34}},{selector:'edge[src="fdb"]',style:{'line-color':'#3fb950'}},{selector:'edge[src="manual"]',style:{'line-color':'#58a6ff'}},{selector:'edge[i != ""]',style:{label:'data(i)','font-size':9,color:'#9aa3b2','text-background-color':'#0a0b0e','text-background-opacity':.9,'text-background-padding':2,'text-rotation':'autorotate'}},{selector:'edge[w="lan"]',style:{'line-style':'solid'}},{selector:'edge[w="wifi"]',style:{'line-style':'dashed','line-dash-pattern':[9,6]}},{selector:'edge[w="unknown"]',style:{'line-style':'dotted'}},{selector:'edge[src="l3"]',style:{opacity:.5,width:1.5}}]});
cy.on('tap','node',e=>pick(+e.target.id()||null));cy.on('tap',e=>{if(e.target===cy){sel=null;list()}});
function savePos(){const p={};cy.nodes().forEach(n=>{p[n.id()]=[n.position('x'),n.position('y')]});api('/api/pos','POST',p)}
cy.on('dragfree','node',savePos);addEventListener('resize',()=>cy.resize());
const fit=()=>cy.fit(null,70);
const rank=n=>{if(!/^\d+$/.test(n.id()))return n.id()=='inet'?6:5;const d=D.find(x=>x.id==n.id());if(!d)return 1;if(d.id==GW)return 4;if(INFRA.includes(d.type))return 3;return FAR.includes(d.type)?1:2};
function relayout(){cy.layout({name:'concentric',animate:true,animationDuration:400,minNodeSpacing:70,concentric:rank,levelWidth:()=>1,stop:()=>{savePos();fit()}}).run()}
function treeLayout(){cy.layout({name:'breadthfirst',directed:true,roots:'#inet',spacingFactor:1.2,padding:40,animate:true,animationDuration:400,stop:()=>{savePos();fit()}}).run()}
function tglSeg(){showSeg=!showSeg;$('bi').classList.toggle('on',showSeg);draw()}
const fb=d=>{const a=(d.id*2.399963)%(Math.PI*2),r=FAR.includes(d.type)?560:300;return{x:Math.cos(a)*r,y:Math.sin(a)*r}};
function draw(){const pos={};cy.nodes().forEach(n=>pos[n.id()]=n.position());const P=(id,def)=>NP[id]||pos[id]||def,els=[];
els.push({data:{id:'inet',l:'Internet',c:'#d93a40',ic:uri('internet')},position:P('inet',{x:0,y:-320})});
if(SELF)els.push({data:{id:'self',l:'NetMap · '+SELF,c:'#58a6ff',ic:uri('server','#58a6ff')},position:P('self',{x:0,y:0})});
D.forEach(d=>els.push({data:{id:''+d.id,l:nm(d),c:col[d.state],st:d.state,hc:d.color||'',ic:uri(d.type,d.color)},position:d.x!=null?{x:d.x,y:d.y}:pos[d.id]||fb(d)}));
const ids=new Set(els.map(e=>e.data.id));
E.forEach(e=>{if(ids.has(''+e.a)&&ids.has(''+e.b))els.push({data:{id:'e'+e.a+'_'+e.b+'_'+e.src,source:''+e.a,target:''+e.b,s:1,src:e.src,i:e.info||'',w:(D.find(x=>x.id==e.b)||{}).conn_eff||'lan'}})});
cy.json({elements:els});if(sel)cy.getElementById(''+sel).select();
if(first&&D.length){first=false;if(!D.some(d=>d.x!=null)&&!Object.keys(NP).length)treeLayout();else setTimeout(fit,300)}}
/* list + detail */
function ok(d){const q=$('q').value.toLowerCase();return(!$('fs').value||d.state==$('fs').value)&&(!$('fc').value||d.conn_eff==$('fc').value)&&(!q||[d.ip,d.mac,d.hostname,d.vendor,d.type,d.os].join(' ').toLowerCase().includes(q))}

  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();ls.forEach(line)}
